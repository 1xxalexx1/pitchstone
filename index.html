<!DOCTYPE html>
<html lang="en" class="dark" data-shell="vault">
<head>
  <meta charset="utf-8">
  <title>Pitchstone</title>
  <link rel="stylesheet" href="node_modules/codemirror/lib/codemirror.css">
  <link rel="stylesheet" href="node_modules/codemirror/addon/hint/show-hint.css">
  <link rel="stylesheet" href="node_modules/codemirror/addon/lint/lint.css">
  <link rel="stylesheet" href="css/pitchstone.css">
</head>
<body>
  <header class="ps-titlebar">
    <span class="ps-titlebar__brand">Pitchstone</span>
    <p id="path" class="ps-titlebar__path">no folder yet</p>
    <div class="ps-titlebar__actions">
      <button type="button" class="bcs-btn bcs-btn-outline bcs-btn-sm" id="open">Open</button>
      <button type="button" class="bcs-btn bcs-btn-outline bcs-btn-sm" id="save">Save</button>
      <button type="button" class="bcs-btn bcs-btn-outline bcs-btn-sm" id="export-md">Export MD</button>
      <button type="button" class="bcs-btn bcs-btn-primary bcs-btn-sm" id="new-file">New</button>
      <button type="button" class="bcs-btn bcs-btn-outline bcs-btn-sm" id="new-folder">Folder</button>
      <button type="button" class="bcs-btn bcs-btn-outline bcs-btn-sm" id="rename-file">Rename</button>
      <button type="button" class="bcs-btn bcs-btn-destructive bcs-btn-sm" id="delete-file">Delete</button>
      <div id="shell-toggle" class="ps-segment" role="group" aria-label="Shell">
        <button type="button" data-shell="vault" aria-selected="true">Vault</button>
        <button type="button" data-shell="ide" aria-selected="false">Code</button>
      </div>
      <button type="button" class="bcs-btn bcs-btn-ghost bcs-btn-sm" id="theme-toggle" aria-label="Toggle theme">Light</button>
    </div>
  </header>
  <div id="workspace" class="ps-workspace">
    <aside id="icon-rail" class="ps-rail ps-rail--ribbon" aria-label="Navigate">
      <button type="button" class="ps-rail__icon" aria-current="true" title="Files">▤<span class="ps-rail__label">Files</span></button>
      <button type="button" class="ps-rail__icon" title="Search" disabled>⌕<span class="ps-rail__label">Search</span></button>
      <button type="button" class="ps-rail__icon" title="Graph" disabled>◈<span class="ps-rail__label">Graph</span></button>
      <button type="button" class="ps-rail__icon" title="Agent" disabled>✦<span class="ps-rail__label">Agent</span></button>
      <button type="button" class="ps-rail__icon" title="Plugins" disabled>⬡<span class="ps-rail__label">Plugins</span></button>
      <span class="ps-rail__grow"></span>
      <button type="button" class="ps-rail__icon" title="Settings" disabled>⚙<span class="ps-rail__label">Settings</span></button>
    </aside>
    <aside id="tree-rail" class="ps-rail ps-rail--tree" aria-label="Files">
      <div id="open-notes" hidden>
        <div class="ps-panel-hdr">OPEN NOTES</div>
        <ul id="open-notes-list" class="ps-tree ps-tree--open"></ul>
      </div>
      <div class="ps-panel-hdr">FILES</div>
      <ul id="files" class="ps-tree"></ul>
      <div id="unresolved-wrap" hidden>
        <div class="ps-panel-hdr">UNRESOLVED LINKS</div>
        <ul id="unresolved" class="ps-tree"></ul>
      </div>
    </aside>
    <div id="centre" class="ps-centre">
      <div id="empty-vault" class="ps-brand" hidden>
        <div class="grain-overlay"></div>
        <div class="ps-brand__inner">
          <h2 class="brand-display">What are we writing today?</h2>
          <p>Open a vault. Notes are HTML on disk. Markdown is a view.</p>
          <button type="button" class="bcs-btn bcs-btn-primary" id="empty-open">Open vault</button>
        </div>
      </div>
      <div class="ps-tabstrip" role="tablist" aria-label="Open notes">
        <button type="button" class="ps-tab" id="note-tab" aria-selected="true">
          <span id="note-tab-label">untitled</span>
          <span id="note-dirty" class="ps-dot" hidden></span>
        </button>
      </div>
      <div class="ps-viewbar">
        <div id="tabs" class="ps-segment" role="tablist" aria-label="Editor mode">
          <button type="button" role="tab" data-tab="markdown" aria-selected="true" aria-controls="editor">Markdown</button>
          <button type="button" role="tab" data-tab="html" aria-selected="false" aria-controls="editor">HTML</button>
          <button type="button" role="tab" data-tab="cssjs" aria-selected="false" aria-controls="editor">CSS+JS</button>
        </div>
      </div>
      <nav id="breadcrumbs" class="ps-breadcrumbs" hidden aria-label="Path"></nav>
      <div id="split" class="ps-split">
        <div id="editor-pane" class="ps-editor-pane">
          <textarea id="editor" spellcheck="false" role="tabpanel" aria-label="Markdown"></textarea>
        </div>
        <div class="ps-preview-pane">
          <iframe id="preview" class="ps-preview" sandbox="allow-scripts" title="Preview"></iframe>
        </div>
      </div>
      <aside id="dock" class="ps-dock" hidden>
        <div class="ps-dock__tabs">
          <button type="button" class="ps-dock__tab" data-dock="problems" aria-selected="true">Problems</button>
          <button type="button" class="ps-dock__tab" data-dock="output">Output</button>
          <button type="button" class="ps-dock__tab" data-dock="backlinks">Backlinks</button>
          <button type="button" class="ps-dock__tab" data-dock="agent">Agent</button>
          <button type="button" class="ps-dock__fold" id="dock-fold" aria-label="Collapse dock">v</button>
        </div>
        <div class="ps-dock__body" id="dock-body">No problems.</div>
      </aside>
    </div>
    <aside id="utility" class="ps-rail ps-rail--utility" aria-label="Inspect">
      <div class="ps-utility-hdr" role="tablist">
        <button type="button" data-util="outline" aria-selected="true">Outline</button>
        <button type="button" data-util="backlinks">Backlinks</button>
        <button type="button" data-util="agent">Agent</button>
      </div>
      <div class="ps-utility-body" id="utility-body">No outline yet.</div>
    </aside>
  </div>
  <footer class="ps-statusbar">
    <span id="status" class="ps-save">Ready</span>
    <span class="ps-statusbar__right">sandbox allow-scripts</span>
  </footer>
  <dialog id="name-dialog">
    <form method="dialog">
      <label id="name-dialog-label" for="name-dialog-input">Note name</label>
      <input id="name-dialog-input" class="bcs-input" name="name" autocomplete="off">
      <div class="ps-dialog-actions">
        <button type="submit" class="bcs-btn bcs-btn-primary bcs-btn-sm" value="ok">OK</button>
        <button type="submit" class="bcs-btn bcs-btn-outline bcs-btn-sm" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <dialog id="confirm-dialog">
    <form method="dialog">
      <p id="confirm-dialog-text"></p>
      <div class="ps-dialog-actions">
        <button type="submit" class="bcs-btn bcs-btn-destructive bcs-btn-sm" value="ok">OK</button>
        <button type="submit" class="bcs-btn bcs-btn-outline bcs-btn-sm" value="cancel">Cancel</button>
      </div>
    </form>
  </dialog>
  <div id="wiki-popup" class="ps-popover" hidden role="listbox" aria-label="Notes"></div>
  <script src="node_modules/codemirror/lib/codemirror.js"></script>
  <script src="node_modules/codemirror/mode/xml/xml.js"></script>
  <script src="node_modules/codemirror/mode/javascript/javascript.js"></script>
  <script src="node_modules/codemirror/mode/css/css.js"></script>
  <script src="node_modules/codemirror/mode/htmlmixed/htmlmixed.js"></script>
  <script src="node_modules/codemirror/mode/markdown/markdown.js"></script>
  <script src="node_modules/codemirror/addon/mode/multiplex.js"></script>
  <script src="node_modules/codemirror/addon/edit/matchbrackets.js"></script>
  <script src="node_modules/codemirror/addon/edit/closebrackets.js"></script>
  <script src="node_modules/codemirror/addon/edit/closetag.js"></script>
  <script src="node_modules/codemirror/addon/display/placeholder.js"></script>
  <script src="node_modules/codemirror/addon/selection/active-line.js"></script>
  <script src="node_modules/codemirror/addon/hint/show-hint.js"></script>
  <script src="node_modules/codemirror/addon/hint/xml-hint.js"></script>
  <script src="node_modules/codemirror/addon/hint/html-hint.js"></script>
  <script src="node_modules/codemirror/addon/hint/css-hint.js"></script>
  <script src="node_modules/codemirror/addon/hint/javascript-hint.js"></script>
  <script src="node_modules/codemirror/addon/hint/anyword-hint.js"></script>
  <script src="node_modules/codemirror/addon/lint/lint.js"></script>
  <script src="node_modules/turndown/lib/turndown.browser.umd.js"></script>
  <script src="node_modules/marked/lib/marked.umd.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
